name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: python -m compileall -q src
      - run: pytest -q

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[test,macos]'
      - run: pytest -q
      - name: Build the tools without signing
        env:
          CLAUDE_HUMAN_IDENTITY: none
          CLAUDE_HUMAN_BUNDLE_ID: org.example.sckshot
        run: |
          claude-human build-tools --out "$RUNNER_TEMP/bin"
          test -x "$RUNNER_TEMP/bin/sckshot.app/Contents/MacOS/sckshot"
          test -x "$RUNNER_TEMP/bin/vhid_type"
          plutil -lint "$RUNNER_TEMP/bin/sckshot.app/Contents/Info.plist"

  js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # the integration test runs the real task server, so the Python package is installed too
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ..
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          # here a missing server is a failure, not a skip
          CLAUDE_HUMAN_REQUIRE_SERVER: "1"

  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/expo-tasks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
